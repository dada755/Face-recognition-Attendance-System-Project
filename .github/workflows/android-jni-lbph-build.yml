name: Android JNI LBPH Native Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_API: "24"
      ANDROID_ABI: "arm64-v8a"
      NDK_VERSION: "27.2.12479018"
      OPENCV_VERSION: "4.14.0"

    steps:

      # ------------------------------------------------
      # Checkout
      # ------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------
      # Host dependencies
      # ------------------------------------------------
      - name: Install build dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            cmake \
            ninja-build \
            git \
            unzip \
            zip \
            openjdk-17-jdk

      # ------------------------------------------------
      # Android SDK
      # ------------------------------------------------
      - name: Install Android SDK
        run: |
          set -euxo pipefail

          SDK_ROOT="$RUNNER_TEMP/android-sdk"

          mkdir -p "$SDK_ROOT/cmdline-tools"

          curl -fsSL \
            -o "$RUNNER_TEMP/cmdline-tools.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip

          unzip -q \
            "$RUNNER_TEMP/cmdline-tools.zip" \
            -d "$RUNNER_TEMP/cmdline-tools"

          mkdir -p "$SDK_ROOT/cmdline-tools/latest"

          cp -a \
            "$RUNNER_TEMP/cmdline-tools/cmdline-tools/." \
            "$SDK_ROOT/cmdline-tools/latest/"

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;$NDK_VERSION"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      # ------------------------------------------------
      # Verify Android toolchain
      # ------------------------------------------------
      - name: Verify Android toolchain
        run: |
          set -euxo pipefail

          echo "HOST=$(uname -m)"
          echo "JAVA=$(java -version 2>&1 | head -n 1)"
          echo "CMAKE=$(cmake --version | head -n 1)"
          echo "NINJA=$(ninja --version)"

          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" \
            --version | head -n 3

          test -f \
            "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/jni.h"

      # ------------------------------------------------
      # Clone OpenCV + contrib
      # ------------------------------------------------
      - name: Fetch OpenCV sources
        run: |
          set -euxo pipefail

          git clone --depth 1 \
            --branch "$OPENCV_VERSION" \
            https://github.com/opencv/opencv.git \
            "$RUNNER_TEMP/opencv"

          git clone --depth 1 \
            --branch "$OPENCV_VERSION" \
            https://github.com/opencv/opencv_contrib.git \
            "$RUNNER_TEMP/opencv_contrib"

          test -f \
            "$RUNNER_TEMP/opencv_contrib/modules/face/src/lbph_faces.cpp"

      # ------------------------------------------------
      # Configure clean Android OpenCV
      # ------------------------------------------------
      - name: Configure OpenCV Android ARM64
        run: |
          set -euxo pipefail

          mkdir -p "$RUNNER_TEMP/opencv-build"

          cmake \
            -S "$RUNNER_TEMP/opencv" \
            -B "$RUNNER_TEMP/opencv-build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ANDROID_ABI" \
            -DANDROID_PLATFORM="android-$ANDROID_API" \
            -DANDROID_STL=c++_shared \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/opencv-install" \
            -DOPENCV_EXTRA_MODULES_PATH="$RUNNER_TEMP/opencv_contrib/modules" \
            -DBUILD_LIST=core,imgproc,objdetect,calib3d,photo,face \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_ANDROID_EXAMPLES=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_PERF_TESTS=OFF \
            -DBUILD_DOCS=OFF \
            -DBUILD_opencv_apps=OFF \
            -DBUILD_ANDROID_PROJECTS=OFF \
            -DBUILD_opencv_python_bindings_generator=OFF \
            -DBUILD_opencv_python3=OFF \
            -DBUILD_opencv_dnn=OFF \
            -DWITH_PROTOBUF=OFF \
            -DWITH_OPENCL=OFF \
            -DWITH_OPENMP=OFF \
            -DWITH_TBB=OFF \
            -DWITH_CUDA=OFF \
            -DWITH_VULKAN=OFF \
            -DWITH_GSTREAMER=OFF \
            -DWITH_FFMPEG=OFF \
            -DWITH_GTK=OFF \
            -DWITH_QT=OFF \
            -DWITH_JAVA=OFF \
            -DWITH_OBJC=OFF \
            -DBUILD_JAVA=OFF

      # ------------------------------------------------
      # Build + install OpenCV
      # ------------------------------------------------
      - name: Build and install OpenCV
        run: |
          set -euxo pipefail

          cmake \
            --build "$RUNNER_TEMP/opencv-build" \
            --parallel 2

          cmake \
            --install "$RUNNER_TEMP/opencv-build"

          FACE_SO="$(find \
            "$RUNNER_TEMP/opencv-install" \
            -type f \
            -name 'libopencv_face.so' \
            | head -n 1)"

          test -n "$FACE_SO"
          test -f "$FACE_SO"

          nm -D -C "$FACE_SO" | \
            grep -F \
            'cv::face::LBPHFaceRecognizer::create'

      # ------------------------------------------------
      # Verify installed OpenCV package
      # ------------------------------------------------
      - name: Verify installed OpenCV dependency closure
        run: |
          set -euxo pipefail

          echo "========== INSTALLED OPENCV =========="

          find "$RUNNER_TEMP/opencv-install" \
            -type f \
            -name 'libopencv_*.so' \
            -print | sort

          echo
          echo "========== FORBIDDEN DEPENDENCY SCAN =========="

          if find "$RUNNER_TEMP/opencv-install" \
              -type f \
              -name 'libopencv_*.so' \
              -exec readelf -d {} \; | \
              grep -E \
              'libpython|libopenblas|libprotobuf|libabsl|libopencv_dnn|libz\.so\.1'
          then
            echo "[FAIL] Forbidden dependency detected"
            exit 1
          fi

          echo "[PASS] Clean OpenCV dependency scan"

      # ------------------------------------------------
      # Create isolated JNI bridge project
      # ------------------------------------------------
      - name: Create JNI bridge source
        run: |
          set -euxo pipefail

          mkdir -p \
            "$RUNNER_TEMP/jni-build"

          cat > "$RUNNER_TEMP/jni-build/native_lbph.cpp" <<'CPP'
          #include <jni.h>

          #include <opencv2/core.hpp>
          #include <opencv2/imgproc.hpp>
          #include <opencv2/objdetect.hpp>
          #include <opencv2/calib3d.hpp>
          #include <opencv2/face.hpp>

          #include <string>

          extern "C"
          JNIEXPORT jstring JNICALL
          Java_com_example_lbphjni_MainActivity_nativeSmokeTest(
                  JNIEnv* env,
                  jclass) {

              cv::Ptr<cv::face::LBPHFaceRecognizer> recognizer =
                  cv::face::LBPHFaceRecognizer::create();

              cv::Mat testImage(
                  100,
                  100,
                  CV_8UC1,
                  cv::Scalar(127)
              );

              cv::Mat equalized;

              cv::equalizeHist(
                  testImage,
                  equalized
              );

              if (recognizer.empty() || equalized.empty()) {
                  return env->NewStringUTF("LBPH JNI FAILED");
              }

              return env->NewStringUTF(
                  "LBPH JNI OK"
              );
          }
          CPP

          test -s "$RUNNER_TEMP/jni-build/native_lbph.cpp"

      # ------------------------------------------------
      # JNI CMake
      # ------------------------------------------------
      - name: Configure JNI bridge
        run: |
          set -euxo pipefail

          cat > "$RUNNER_TEMP/jni-build/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.22.1)

          project(native_lbph LANGUAGES CXX)

          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)

          set(OpenCV_DIR
              "$ENV{RUNNER_TEMP}/opencv-install/lib/cmake/opencv4"
          )

          find_package(OpenCV REQUIRED
              COMPONENTS
              core
              imgproc
              objdetect
              calib3d
              face
          )

          find_library(LOG_LIB log)
          find_library(ANDROID_LIB android)

          add_library(native_lbph SHARED
              native_lbph.cpp
          )

          target_include_directories(native_lbph PRIVATE
              ${OpenCV_INCLUDE_DIRS}
          )

          target_link_libraries(native_lbph PRIVATE
              ${OpenCV_LIBS}
              ${LOG_LIB}
              ${ANDROID_LIB}
          )
          CMAKE

          cmake \
            -S "$RUNNER_TEMP/jni-build" \
            -B "$RUNNER_TEMP/jni-build-output" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ANDROID_ABI" \
            -DANDROID_PLATFORM="android-$ANDROID_API" \
            -DANDROID_STL=c++_shared \
            -DOpenCV_DIR="$RUNNER_TEMP/opencv-install/lib/cmake/opencv4"

      # ------------------------------------------------
      # Build JNI library
      # ------------------------------------------------
      - name: Build JNI bridge
        run: |
          set -euxo pipefail

          cmake \
            --build "$RUNNER_TEMP/jni-build-output" \
            --parallel 2

          JNI_SO="$RUNNER_TEMP/jni-build-output/libnative_lbph.so"

          test -f "$JNI_SO"

          file "$JNI_SO"

          readelf -h "$JNI_SO" | \
            grep -E \
            'Class:.*ELF64|Machine:.*AArch64'

          readelf -d "$JNI_SO"

          echo "========== JNI EXPORT =========="

          nm -D "$JNI_SO" | \
            grep -F \
            'Java_com_example_lbphjni_MainActivity_nativeSmokeTest'

      # ------------------------------------------------
      # JNI dependency verification
      # ------------------------------------------------
      - name: Verify JNI dependency closure
        run: |
          set -euxo pipefail

          JNI_SO="$RUNNER_TEMP/jni-build-output/libnative_lbph.so"

          echo "========== NEEDED =========="

          readelf -d "$JNI_SO" | \
            grep NEEDED

          echo
          echo "========== FORBIDDEN DEPENDENCIES =========="

          if readelf -d "$JNI_SO" | \
              grep -E \
              'libpython|libopenblas|libprotobuf|libabsl|libopencv_dnn|libz\.so\.1'
          then
            echo "[FAIL] Forbidden JNI dependency detected"
            exit 1
          fi

          echo "[PASS] JNI dependency scan"

      # ------------------------------------------------
      # Package isolated native artifact
      # ------------------------------------------------
      - name: Package JNI artifact
        run: |
          set -euxo pipefail

          OUT="$RUNNER_TEMP/android-jni-lbph-artifact"

          mkdir -p "$OUT/lib/arm64-v8a"

          cp \
            "$RUNNER_TEMP/jni-build-output/libnative_lbph.so" \
            "$OUT/lib/arm64-v8a/"

          find "$RUNNER_TEMP/opencv-install" \
            -type f \
            -name 'libopencv_*.so' \
            -exec cp {} "$OUT/lib/arm64-v8a/" \;

          cp \
            "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
            "$OUT/lib/arm64-v8a/"

          find "$OUT" -type f -print | sort

          cd "$OUT"

          zip -r \
            "$RUNNER_TEMP/android-jni-lbph.zip" \
            .

      # ------------------------------------------------
      # Upload artifact
      # ------------------------------------------------
      - name: Upload JNI artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-jni-lbph
          path: ${{ runner.temp }}/android-jni-lbph.zip
          if-no-files-found: error
