name: Android OpenCV LBPH Native Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-opencv-lbph:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            git \
            unzip \
            zip \
            openjdk-17-jdk

      - name: Verify host
        run: |
          uname -a
          uname -m
          cmake --version
          ninja --version
          java -version

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd "$HOME/android-sdk"

          curl -fsSL \
            -o commandlinetools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip

          unzip -q commandlinetools.zip -d "$HOME/android-sdk/cmdline-tools"

          mkdir -p "$HOME/android-sdk/cmdline-tools/latest"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools/"* \
             "$HOME/android-sdk/cmdline-tools/latest/"

          rm -rf "$HOME/android-sdk/cmdline-tools/cmdline-tools"
          rm commandlinetools.zip

      - name: Configure Android SDK
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Export Android toolchain
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$HOME/android-sdk/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$HOME/android-sdk/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Verify Android NDK
        run: |
          test -d "$ANDROID_NDK_HOME"
          test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Clone OpenCV 4.14.0
        run: |
          mkdir -p "$RUNNER_TEMP/opencv-src"

          git clone --depth 1 \
            --branch 4.14.0 \
            https://github.com/opencv/opencv.git \
            "$RUNNER_TEMP/opencv-src/opencv"

      - name: Clone OpenCV contrib 4.14.0
        run: |
          git clone --depth 1 \
            --branch 4.14.0 \
            https://github.com/opencv/opencv_contrib.git \
            "$RUNNER_TEMP/opencv-src/opencv_contrib"

      - name: Verify LBPH source
        run: |
          test -f "$RUNNER_TEMP/opencv-src/opencv_contrib/modules/face/include/opencv2/face/facerec.hpp"
          grep -R "class.*LBPHFaceRecognizer" \
            "$RUNNER_TEMP/opencv-src/opencv_contrib/modules/face" \
            | head -10

          grep -n "LBPHFaceRecognizer" \
            "$RUNNER_TEMP/opencv-src/opencv_contrib/modules/face/src/facerec.cpp" \
            | head -20

      - name: Configure minimal Android OpenCV
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/android-sdk"

          cmake \
            -S "$RUNNER_TEMP/opencv-src/opencv" \
            -B "$RUNNER_TEMP/opencv-build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DOPENCV_EXTRA_MODULES_PATH="$RUNNER_TEMP/opencv-src/opencv_contrib/modules" \
            -DBUILD_LIST=core,imgproc,objdetect,calib3d,photo,face \
            -DBUILD_ANDROID_PROJECTS=OFF \
            -DBUILD_ANDROID_EXAMPLES=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_PERF_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_DOCS=OFF \
            -DBUILD_opencv_python_bindings_generator=OFF \
            -DBUILD_opencv_python3=OFF \
            -DBUILD_opencv_java_bindings_generator=OFF \
            -DBUILD_opencv_js=OFF \
            -DBUILD_opencv_dnn=OFF \
            -DWITH_PROTOBUF=OFF \
            -DWITH_OPENCL=OFF \
            -DWITH_OPENMP=OFF \
            -DWITH_TBB=OFF \
            -DWITH_CUDA=OFF \
            -DWITH_VULKAN=OFF

      - name: Build minimal OpenCV
        run: |
          cmake --build "$RUNNER_TEMP/opencv-build" \
            --parallel 2

      - name: Verify native LBPH symbol
        run: |
          find "$RUNNER_TEMP/opencv-build" \
            -type f \
            \( -name "libopencv_face.so" -o -name "*opencv_face*.so" \) \
            -print

          FACE_LIB="$(find "$RUNNER_TEMP/opencv-build" \
            -type f -name "libopencv_face.so" | head -1)"

          test -n "$FACE_LIB"
          file "$FACE_LIB"

          nm -D "$FACE_LIB" 2>/dev/null \
            | grep 'LBPHFaceRecognizer' \
            | head -20

      - name: Package build artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/opencv-artifacts"

          find "$RUNNER_TEMP/opencv-build" \
            -type f \
            -name "*.so" \
            -exec cp {} "$RUNNER_TEMP/opencv-artifacts/" \;

          cd "$RUNNER_TEMP/opencv-artifacts"
          zip -9 "$GITHUB_WORKSPACE/opencv-lbph-android-arm64.zip" *.so

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencv-lbph-android-arm64
          path: opencv-lbph-android-arm64.zip
